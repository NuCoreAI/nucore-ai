[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nucore-ai"
version = "2.0.0"
description = "Lightweight library for command/control/optimization/automation of smart home devices using LLMs"
readme = "README.md"
license = "MIT"
authors = [
 { name="Michel Kohanim", email="michel@universal-devices.com" },
]
dependencies = [
 "requests",
 "openai",
 "anthropic",
 "httpx",
 "websockets",
 "udi_interface",
 "python-dotenv",
]
urls = { "Homepage" = "https://github.com/NuCoreAI/nucore-ai.git" }

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag*", "nucore*", "iox*", "unified*", "utils*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
unified = ["prompt/*.md", "tools/*.json", "runtime_config.example.json", "runtime_config.openai.example.json", "runtime_config.grok.example.json"]
"unified.diagnostics" = ["prompts/*.md"]
"unified.planning" = ["prompts/*.md"]
