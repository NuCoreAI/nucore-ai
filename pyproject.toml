[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nucore-ai"
version = "3.2.3"
description = "Lightweight library for command/control/optimization/automation of smart home devices using LLMs"
readme = "README.md"
license = "MIT"
authors = [
 { name="Michel Kohanim", email="michel@universal-devices.com" },
]
dependencies = [
 "openai",
 "anthropic",
 "httpx",
 "websockets",
 "udi_interface",
 "python-dotenv",
 "mcp",
 "uvicorn",
 "starlette",
]
urls = { "Homepage" = "https://github.com/NuCoreAI/nucore-ai.git" }

[project.scripts]
nucore-mcp-server = "unified.run_mcp_server:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "jsonschema<4.18"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag*", "nucore*", "iox*", "unified*", "utils*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
nucore = ["schemas/*.json", "schemas/defs/*.json"]
unified = ["prompt/*.md", "tools/*.json", "runtime_config.example.json", "runtime_config.openai.example.json", "runtime_config.grok.example.json"]
"unified.plugin_authoring" = ["prompt/*.md", "tools/*.json"]
